<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klein De Guzman | Personal Profile</title>
    <link href="css/flexbox.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet"> 
</head>
<body>

    <div class="profile-card">
        <div class="image-container">
            <img src="image 1.jpg" 
                 alt="Klein De Guzman" 
                 class="profile-pic">
            
            <div class="section-title">Photo Moments</div>
            <div class="gallery-container">
                <div class="gallery-item">
                    <img src="image 1.jpg" alt="Man in a green jacket reflected in a mirror">
                </div>
                <div class="gallery-item">
                    <img src="image 2.jpg" alt="Chrome human-like figure on a starry background">
                </div>
                <div class="gallery-item">
                    <img src="image 3.jpg" alt="Man resting with feet on a table, looking at his phone">
                </div>
                <div class="gallery-item">
                    <img src="image 4.jpg" alt="White tiger resting behind a metal fence">
                </div>
                <div class="gallery-item">
                    <img src="image 5.jpg" alt="Dolphin swimming in the ocean near a dock railing">
                </div>
            </div>

        </div>

        <div class="info-container">
            <div class="nickname">The "Shyboy"</div>
            <h1>Klein De Guzman</h1>
            <div class="details">
                BSCS-SF • 2nd Year Student
            </div>

            <div class="section-title">Everyday Hobbies</div>
            <div class="hobby-list">
                <span class="tag">Sleep</span>
                <span class="tag">Study</span>
                <span class="tag">Money</span>
                <span class="tag">Workout</span>
                <span class="tag">Eat</span>
                <span class="tag">Pray</span>
                <span class="tag">Repeat</span>
            </div>

            <div class="section-title">Personal Goal</div>
            <div class="goal-text">
                "Cheap Luxury Life, hehe"
            </div>
            
            </div>
