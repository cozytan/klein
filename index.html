<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klein Vincent De Guzman | Portfolio</title>
    <style>
        /* --- CSS STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: white;
            overflow-x: hidden;
            transition: background 0.5s ease;
        }

        /* Container for smooth transitions */
        .page {
            display: none;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.8s ease-in-out;
        }

        .active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- HOME PAGE (Flexbox) --- */
        #home {
            text-align: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        .intro-text {
            font-size: 2.5rem;
            max-width: 800px;
            margin-bottom: 2rem;
            line-height: 1.4;
        }

        .btn {
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #0f172a;
            background-color: #38bdf8;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
        }

        .btn:hover {
            transform: scale(1.05);
            background-color: #7dd3fc;
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.6);
        }

        /* --- GALLERY PAGE (Grid) --- */
        #gallery {
            justify-content: flex-start;
            padding-top: 50px;
        }

        .gallery-title {
            margin-bottom: 40px;
            font-size: 2rem;
            color: #38bdf8;
        }

        /* Grid Layout for Images */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr); /* 6 columns to allow 2-column and 3-column centering */
            gap: 20px;
            max-width: 1000px;
            width: 100%;
        }

        .img-card {
            background-color: #1e293b;
            border-radius: 12px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid #334155;
            transition: transform 0.3s ease;
        }

        .img-card:hover {
            transform: translateY(-5px);
            border-color: #38bdf8;
        }

        .img-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Layout Logic: Top row (3 images) */
        .top-row { grid-column: span 2; } 
        
        /* Layout Logic: Bottom row (2 images) centered */
        .bottom-row { grid-column: span 3; }

        .statement {
            margin-top: 40px;
            font-size: 1.2rem;
            font-style: italic;
            color: #94a3b8;
            text-align: center;
        }

        .back-btn {
            margin-top: 30px;
            background-color: transparent;
            color: #38bdf8;
            border: 1px solid #38bdf8;
        }

    </style>
</head>
<body>

    <section id="home" class="page active">
        <h1 class="intro-text">
            I am, <strong>Klein Vincent De Guzman</strong>, a Computer Science Student at Asia Pacific College.
        </h1>
        <button class="btn" onclick="navigateTo('gallery')">View My Gallery</button>
    </section>

    <section id="gallery" class="page">
        <h2 class="gallery-title">My Projects & Life</h2>
        
        <div class="image-grid">
             <div class="img-card top-row"><img src="apc4" alt=""></div>
            <div class="img-card top-row"><img src="apc3" alt=""></div>
            <div class="img-card top-row"><img src="klein1" alt=""></div>
            
            <div class="img-card bottom-row"><img src="apc5" alt=""></div>
            <div class="img-card bottom-row"><img src="apc1" alt=""></div>
        </div>

        <p class="statement">"Driven by logic, inspired by creativity, and building the future through code."</p>
        
        <button class="btn back-btn" onclick="navigateTo('home')">Go Back Home</button>
    </section>

    <script>
        /* --- JAVASCRIPT FOR NAVIGATION --- */
        function navigateTo(pageId) {
            // Hide all pages
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });

            // Show the target page
            const target = document.getElementById(pageId);
            target.classList.add('active');

            // Optional: Smooth scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
