<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klein Vincent De Guzman | Portfolio</title>
    <style>
        /* --- CSS STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: white;
            overflow-x: hidden;
        }

        .page {
            display: none;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.8s ease-in-out;
        }

        .active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- HOME PAGE --- */
        #home {
            text-align: center;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        .intro-text {
            font-size: 2.2rem;
            max-width: 800px;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #0f172a;
            background-color: #38bdf8;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .btn:hover {
            transform: scale(1.05);
            background-color: #7dd3fc;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
        }

        /* --- GALLERY PAGE (Grid) --- */
        .gallery-title {
            margin-bottom: 30px;
            font-size: 2.5rem;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr); 
            gap: 20px;
            max-width: 1000px;
            width: 100%;
        }

        .img-card {
            background-color: #1e293b;
            border-radius: 15px;
            height: 250px;
            overflow: hidden;
            border: 2px solid #334155;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: 0.4s ease;
        }

        .img-card:hover {
            transform: translateY(-10px);
            border-color: #38bdf8;
        }

        .img-card img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* This ensures images fill the box without stretching */
            display: block;
        }

        /* Top Row: 3 images (2 columns each) */
        .top-row { grid-column: span 2; } 
        
        /* Bottom Row: 2 images (3 columns each) */
        .bottom-row { grid-column: span 3; }

        .statement {
            margin-top: 40px;
            font-size: 1.2rem;
            font-style: italic;
            color: #94a3b8;
            text-align: center;
            max-width: 700px;
        }

        .back-btn {
            margin-top: 30px;
            background-color: transparent;
            color: #38bdf8;
            border: 2px solid #38bdf8;
        }
    </style>
</head>
<body>

    <section id="home" class="page active">
        <h1 class="intro-text">
            I am, <strong>Klein Vincent De Guzman</strong> a Computer Science Student at Asia Pacific College.
        </h1>
        <button class="btn" onclick="navigateTo('gallery')">View My Gallery</button>
    </section>

    <section id="gallery" class="page">
        <h2 class="gallery-title">My Anonymous Profile</h2>
        
        <div class="image-grid">
            <div class="img-card top-row">
                <img src="https://images.unsplash.com/photo-1594463750939-ebb28c3f7f75?auto=format&fit=crop&w=500&q=80" alt="Spongebob Vibes">
            </div>
            <div class="img-card top-row">
                <img src="https://images.unsplash.com/photo-1560160912-32999e236391?auto=format&fit=crop&w=500&q=80" alt="Blue Ranger Vibes">
            </div>
            <div class="img-card top-row">
                <img src="https://images.unsplash.com/photo-1559131397-f94da358f7ca?auto=format&fit=crop&w=500&q=80" alt="Patrick Vibes">
            </div>
            
            <div class="img-card bottom-row">
                <img src="https://images.unsplash.com/photo-1613771404721-1f92d799e49f?auto=format&fit=crop&w=500&q=80" alt="Pikachu Vibes">
            </div>
            <div class="img-card bottom-row">
                <img src="https://images.unsplash.com/photo-1578632292335-df3abbb0d586?auto=format&fit=crop&w=500&q=80" alt="Sukuna/Anime Vibes">
            </div>
        </div>

        <p class="statement">"Still young... Don't want to count it."</p>
        
        <button class="btn back-btn" onclick="navigateTo('home')">Go Back Home</button>
    </section>

    <script>
        function navigateTo(pageId) {
            // Hide all pages
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            // Show the clicked page
            document.getElementById(pageId).classList.add('active');
            // Scroll to top automatically
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
