<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klein Vincent | Portfolio</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            --accent-color: #4a90e2;
            --text-main: #2d3436;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .container {
            width: 95%;
            max-width: 900px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 40px;
            text-align: center;
        }

        .page {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hidden { display: none; }

        h1 { font-size: 2rem; margin-bottom: 10px; }
        .sub-text { color: var(--accent-color); font-size: 1.1rem; margin-bottom: 30px; }

        /* --- THE HORIZONTAL ID ROW --- */
        .main-image-row {
            display: flex;
            flex-direction: row; /* FORCES HORIZONTAL */
            justify-content: center;
            align-items: center;
            flex-wrap: nowrap; /* Prevents stacking unless on very small screens */
            gap: 10px;
            margin-bottom: 30px;
            width: 100%;
            overflow-x: auto; /* Adds scroll if they don't fit */
        }

        .main-image-row img {
            /* STARK 2x2 ID SIZE */
            width: 100px; 
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
            border: 2px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            flex-shrink: 0; /* Prevents images from squishing */
        }

        .btn {
            background: var(--text-main);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover { background: var(--accent-color); }

        /* Page 2 Styling */
        .gallery-wrapper {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .image-card img { width: 100%; max-width: 400px; border-radius: 10px; }
    </style>
</head>
<body>

    <main class="container">
        <section id="home-page" class="page">
            <h1>I am, Klein Vincent De Guzman</h1>
            <p class="sub-text">a Computer Science with a specialization in Cybersecurity & Forensics, Student at Asia Pacific College</p>

            <div class="main-image-row">
                <img src="klein1.jpg" alt="ID 1">
                <img src="klein2.jpg" alt="ID 2">
                <img src="klein3.jpg" alt="ID 3">
                <img src="klein4.jpg" alt="ID 4">
                <img src="klein5.jpg" alt="ID 5">
            </div>

            <button class="btn" onclick="showGallery()">See More About Me</button>
        </section>

        <section id="gallery-page" class="page hidden">
            <div class="gallery-wrapper">
                <div class="image-card">
                    <img src="klein1.jpg" alt="Full 1">
                    <p>Building the future through clean code.</p>
                </div>
            </div>
            <button class="btn" onclick="showHome()" style="margin-top:20px; background:#666;">← Back Home</button>
        </section>
    </main>

    <script>
        function showGallery() {
            document.getElementById('home-page').classList.add('hidden');
            document.getElementById('gallery-page').classList.remove('hidden');
        }
        function showHome() {
            document.getElementById('gallery-page').classList.add('hidden');
            document.getElementById('home-page').classList.remove('hidden');
        }
    </script>
</body>
</html>
