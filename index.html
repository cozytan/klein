<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klein Vincent | Portfolio</title>
    <style>
        /* CSS VARIABLES: Colors and Glassmorphism */
        :root {
            --bg-gradient: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            --accent-color: #4a90e2;
            --text-main: #2d3436;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            /* GRID: Used to center the entire container */
            display: grid;
            place-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            width: 95%;
            max-width: 1000px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 40px;
            text-align: center;
        }

        /* FLEXBOX: Organizes page content vertically */
        .page {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.5s ease;
        }

        .hidden {
            display: none;
            opacity: 0;
        }

        #home-page h1 {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            margin-bottom: 10px;
        }

        #home-page span {
            color: var(--accent-color);
            display: block;
            font-weight: 300;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        /* FLEXBOX: Horizontal ID-style image row */
        .main-image-row {
            display: flex;
            flex-direction: row;
            justify-content: center;
            flex-wrap: wrap; /* Ensures images wrap on smaller screens */
            gap: 15px;
            margin-bottom: 30px;
        }

        .main-image-row img {
            width: 150px;  /* Fixed 2x2 ID size */
            height: 150px; 
            object-fit: cover; /* Prevents image distortion */
            border-radius: 8px;
            border: 3px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .main-image-row img:hover {
            transform: scale(1.1);
            border-color: var(--accent-color);
        }

        .btn {
            background: var(--text-main);
            color: white;
            padding: 15px 35px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .btn:hover {
            background: var(--accent-color);
            transform: scale(1.05);
        }

        /* GALLERY PAGE STYLING */
        .gallery-wrapper {
            display: flex;
            flex-direction: column;
            gap: 40px;
            width: 100%;
            align-items: center;
        }

        .image-card {
            width: 100%;
            max-width: 450px;
        }

        .image-card img {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .image-card p {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #555;
        }

        @media (max-width: 600px) {
            .container { padding: 25px; }
            .main-image-row img {
                width: 100px; /* Smaller size for mobile phones */
                height: 100px;
            }
        }
    </style>
</head>
<body>

    <main class="container">
        
        <section id="home-page" class="page">
            <h1>I am, Klein Vincent De Guzman</h1>
            <span>a Computer Science with a specialization in Cybersecurity & Forensics, Student at Asia Pacific College</span>

            <div class="main-image-row">
                <img src="klein1.jpg" alt="ID 1">
                <img src="klein2.jpg" alt="ID 2">
                <img src="klein3.jpg" alt="ID 3">
                <img src="klein4.jpg" alt="ID 4">
                <img src="klein5.jpg" alt="ID 5">
            </div>

            <button class="btn" onclick="showGallery()">See More About Me</button>
        </section>

        <section id="gallery-page" class="page hidden">
            <div class="gallery-wrapper">
                <div class="image-card">
                    <img src="klein1.jpg" alt="Klein Image 1">
                    <p>Building the future through clean code and logic.</p>
                </div>
                <div class="image-card">
                    <img src="klein2.jpg" alt="Klein Image 2">
                    <p>Always curious, always learning at APC 😊</p>
                </div>
            </div>
            <button class="btn" onclick="showHome()" style="margin-top:40px; background:#666;">← Back Home</button>
        </section>

    </main>

    <script>
        // JAVASCRIPT: Navigation logic to switch "pages" without reloading
        const homePage = document.getElementById('home-page');
        const galleryPage = document.getElementById('gallery-page');

        function showGallery() {
            homePage.classList.add('hidden');
            galleryPage.classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function showHome() {
            galleryPage.classList.add('hidden');
            homePage.classList.remove('hidden');
            window.scrollTo(0,0);
        }
    </script>

</body>
</html>
