<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klein Vincent De Guzman | Portfolio</title>
    <style>
        /* --- CSS STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: white;
            overflow-x: hidden;
        }

        .page {
            display: none;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.8s ease-in-out;
        }

        .active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- HOME PAGE --- */
        #home {
            text-align: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        .intro-text {
            font-size: 2.2rem;
            max-width: 800px;
            margin-bottom: 2rem;
        }

        .btn {
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #0f172a;
            background-color: #38bdf8;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
            background-color: #7dd3fc;
        }

        /* --- GALLERY PAGE (Grid) --- */
        .gallery-title {
            margin-bottom: 30px;
            font-size: 2rem;
            color: #38bdf8;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr); /* 6 columns for easy math */
            gap: 20px;
            max-width: 900px;
            width: 100%;
        }

        .img-card {
            background-color: #1e293b;
            border-radius: 12px;
            height: 200px;
            overflow: hidden;
            border: 2px solid #334155;
        }

        .img-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Top Row: 3 images (each spans 2 columns = 6) */
        .top-row { grid-column: span 2; } 
        
        /* Bottom Row: 2 images (each spans 3 columns = 6) */
        .bottom-row { grid-column: span 3; }

        .statement {
            margin-top: 30px;
            font-size: 1.1rem;
            font-style: italic;
            color: #94a3b8;
        }

        .back-btn {
            margin-top: 20px;
            background-color: transparent;
            color: #38bdf8;
            border: 1px solid #38bdf8;
        }
    </style>
</head>
<body>

    <section id="home" class="page active">
        <h1 class="intro-text">
            I am, <strong>Klein Vincent De Guzman</strong> a Computer Science Student at Asia Pacific College.
        </h1>
        <button class="btn" onclick="navigateTo('gallery')">View My Gallery</button>
    </section>

    <section id="gallery" class="page">
        <h2 class="gallery-title">My Projects & Life</h2>
        
        <div class="image-grid">
            <div class="img-card top-row"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT7yCq8nId9vB8-Y_1G3E49lW0XGg09fP6p8A&s" alt="Spongebob"></div>
            <div class="img-card top-row"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSfI37qHqFw_X6X8Z-R_I9vY-T_I8X-Y_I9vA&s" alt="Blue Ranger"></div>
            <div class="img-card top-row"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_I9vY-T_I8X-Y_I9vA&s" alt="Patrick"></div>
            
            <div class="img-card bottom-row"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSQO_m05vK8_X-v-R_I9vY-T_I8X-Y_I9vA&s" alt="Pikachu"></div>
            <div class="img-card bottom-row"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_I8X-Y_I9vA-R_I9vY-T_I8X-Y_I9vA&s" alt="Sukuna"></div>
        </div>

        <p class="statement">"Driven by logic, inspired by creativity, and building the future through code."</p>
        
        <button class="btn back-btn" onclick="navigateTo('home')">Go Back Home</button>
    </section>

    <script>
        function navigateTo(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
