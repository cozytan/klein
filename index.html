<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klein Vincent | Portfolio</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            --accent-color: #4a90e2;
            --text-main: #2d3436;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow-x: hidden;
            padding: 20px 0; /* Added padding for mobile breathing room */
        }

        .container {
            width: 90%;
            max-width: 900px;
            /* Changed to max-height with scroll for better UX with many images */
            max-height: 90vh;
            overflow-y: auto; 
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 40px;
            position: relative;
        }

        /* Custom Scrollbar for the Glass Container */
        .container::-webkit-scrollbar {
            width: 8px;
        }
        .container::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 10px;
        }

        .page {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.5s ease;
        }

        .hidden {
            display: none;
            opacity: 0;
            transform: translateY(20px);
        }

        #home-page h1 {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            margin-bottom: 20px;
            line-height: 1.3;
        }

        #home-page span {
            color: var(--accent-color);
            display: block;
            font-weight: 300;
            margin-top: 10px;
        }

        /* Main Page Image List Styling */
        .main-image-stack {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
            max-width: 500px;
            margin: 30px 0;
        }

        .main-image-stack img {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .main-image-stack img:hover {
            transform: scale(1.03);
        }

        .btn {
            background: var(--text-main);
            color: white;
            padding: 15px 35px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, background 0.3s ease;
            margin-bottom: 20px;
        }

        .btn:hover {
            background: var(--accent-color);
            transform: scale(1.05);
        }

        .gallery-wrapper {
            display: flex;
            flex-direction: column;
            gap: 50px;
            width: 100%;
            align-items: center;
        }

        .image-card {
            width: 100%;
            max-width: 450px;
        }

        .image-card img {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .image-card p {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #555;
            letter-spacing: 0.5px;
        }

        .back-btn {
            margin-top: 40px;
            background: transparent;
            color: var(--text-main);
            border: 2px solid var(--text-main);
        }

        @media (max-width: 600px) {
            .container { padding: 25px; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <main class="container">
        
        <section id="home-page" class="page">
            <h1>
                I am, Klein Vincent De Guzman 
                <span>a Computer Science with a specialization in Cybersecurity & Forensics, Student at Asia Pacific College</span>
            </h1>

            <div class="main-image-stack">
                <img src="apc1.jpg" alt="">
                <img src="apc2.jpg" alt="">
                <img src="apc3.jpg" alt="">
                <img src="apc4.jpg" alt="">
                <img src="apc5.jpg" alt="">
            </div>

            <button class="btn" onclick="showGallery()">See More About Me</button>
        </section>

        <section id="gallery-page" class="page hidden">
            <div class="gallery-wrapper">
                <div class="image-card">
                    <img src="klein1.jpg" alt="Klein Vincent De Guzman">
                    <p>HI! Welcome to my personal website. Still young...</p>
                </div>

                <div class="image-card">
                    <img src="klein2.jpg" alt="Klein Vincent De Guzman">
                    <p>Always curious, always learning at APC 😊</p>
                </div>
            </div>
            <button class="btn back-btn" onclick="showHome()">← Back Home</button>
        </section>

    </main>

    <script>
        const homePage = document.getElementById('home-page');
        const galleryPage = document.getElementById('gallery-page');
        const container = document.querySelector('.container');

        function showGallery() {
            homePage.style.opacity = '0';
            setTimeout(() => {
                homePage.classList.add('hidden');
                galleryPage.classList.remove('hidden');
                container.scrollTop = 0; // Reset scroll to top
                setTimeout(() => {
                    galleryPage.style.opacity = '1';
                    galleryPage.style.transform = 'translateY(0)';
                }, 50);
            }, 400);
        }

        function showHome() {
            galleryPage.style.opacity = '0';
            setTimeout(() => {
                galleryPage.classList.add('hidden');
                homePage.classList.remove('hidden');
                container.scrollTop = 0; // Reset scroll to top
                setTimeout(() => {
                    homePage.style.opacity = '1';
                }, 50);
            }, 400);
        }
    </script>

</body>
</html>
